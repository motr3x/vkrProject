databaseChangeLog:
  - changeSet:
      id: 2
      author: your_name
      changes:
        - createTable:
            tableName: vkr
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: supervisors_id
                  type: bigint
              - column:
                  name: title
                  type: varchar(255)
              - column:
                  name: final_grade
                  type: bigint
              - column:
                  name: overall_progress
                  type: double
                  defaultValue: 0.0
              - column:
                  name: last_update
                  type: datetime
                  defaultValue: now()
        - addForeignKeyConstraint:
            baseTableName: vkr
            baseColumnNames: supervisors_id
            referencedTableName: supervisors
            referencedColumnNames: id
            constraintName: fk_vkr_supervisors