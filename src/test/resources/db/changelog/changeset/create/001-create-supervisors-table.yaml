databaseChangeLog:
  - changeSet:
      id: 1
      author: motr3x
      changes:
        - createTable:
            tableName: supervisors
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: first_name
                  type: varchar(255)
              - column:
                  name: second_name
                  type: varchar(255)
              - column:
                  name: middle_name
                  type: varchar(255)
              - column:
                  name: academic_degree
                  type: varchar(255)