databaseChangeLog:
  - changeSet:
      id: 5
      author: your_name
      changes:
        - addColumn:
            tableName: vkr
            columns:
              - column:
                  name: student_id
                  type: bigint
                  constraints:
                    unique: true
        - addForeignKeyConstraint:
            baseTableName: vkr
            baseColumnNames: student_id
            referencedTableName: student
            referencedColumnNames: id
            constraintName: fk_vkr_student